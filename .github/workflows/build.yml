name: Build APK

# Сборка без установки Android Studio: загрузите проект в репозиторий GitHub,
# откройте вкладку Actions → Build APK → Run workflow, затем скачайте APK из Artifacts.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
